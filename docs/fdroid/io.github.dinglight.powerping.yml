# F-Droid 构建元数据（提交 MR 时放到 fdroiddata 仓库的 metadata/ 目录下）
# 用途：fork https://gitlab.com/fdroid/fdroiddata，将本文件复制为
# metadata/io.github.dinglight.powerping.yml，然后向 fdroiddata 发起 Merge Request。
# 应用描述/图标/截图会自动从本仓库的 fastlane/metadata/ 拉取，无需在此重复。

